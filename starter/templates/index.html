<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  
  <div class="difficulty-selector">
    <label>Difficulty:</label>
    <button class="difficulty-btn" data-difficulty="easy">Easy (45)</button>
    <button class="difficulty-btn" data-difficulty="medium" data-selected="true">Medium (35)</button>
    <button class="difficulty-btn" data-difficulty="hard">Hard (30)</button>
  </div>
  
  <div id="sudoku-board"></div>
  <div id="timer">Time: 00:00</div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="check-solution">Check Solution</button>
    <span id="hint-count">Hints: 0</span>
    <span id="message"></span>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
